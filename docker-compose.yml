services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    ports:
      - "2000:2000"
    tmpfs:
      - /piston/jobs:exec
    volumes:
      - piston_data:/piston

volumes:
  mongo_data:
  redis_data:
  piston_data:
